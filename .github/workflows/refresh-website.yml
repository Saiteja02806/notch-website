name: Refresh website release data

on:
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run fetch:release
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/release.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(website): refresh release data"
          git push
