name: Deploy website

# Only needed if you are NOT using Cloudflare Pages' built-in Git integration.
# With the Git integration enabled, Cloudflare builds and deploys on every push
# to main and you can delete this file.

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=heronotch
